<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80/20 Workout Library</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141311">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <meta property="og:title" content="80/20 Workout Library">
  <meta property="og:description" content="Quick lookup for 80/20 Endurance workout codes — Run, Bike, and Swim">
  <meta property="og:image" content="https://kaghaffa.github.io/80-20-training-workout-library/og-image.png">
  <meta property="og:url" content="https://kaghaffa.github.io/80-20-training-workout-library/">
  <meta property="og:type" content="website">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="80/20 Workouts">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #141311;
      --surface: #1D1C19;
      --surface-2: #1A1916;
      --line: #2E2C28;
      --line-2: #3A3833;
      --text: #EDEAE4;
      --text-2: #B9B4AA;
      --dim: #9A958C;
      --faint: #6E6A62;
      --accent: #F07F2A;
      --accent-hi: #FF9A4D;
      --z1: #5BBF8A;
      --z2: #4AA8E0;
      --z3: #E5C04A;
      --z4: #EE8A3C;
      --z5: #E5484D;
      --rest: #4A4740;
      --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif
    }

    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased
    }

    button {
      font-family: inherit;
      color: inherit
    }

    a {
      color: var(--accent)
    }

    .num {
      font-family: var(--display);
      font-weight: 700;
      letter-spacing: .2px
    }

    .label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--dim)
    }

    /* Zone colors */
    .tz1 { background: var(--z1) }
    .tz2 { background: var(--z2) }
    .tz3 { background: var(--z3) }
    .tz4 { background: var(--z4) }
    .tz5 { background: var(--z5) }
    .tz0 { background: var(--rest) }
    .z1 { color: var(--z1) }
    .z2 { color: var(--z2) }
    .z3 { color: var(--z3) }
    .z4 { color: var(--z4) }
    .z5 { color: var(--z5) }

    .zone-tag {
      font-weight: 600
    }

    /* Header */
    .header {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 16px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 10
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--display)
    }

    .brand-mark {
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--accent);
      letter-spacing: .5px
    }

    .brand-name {
      font-weight: 600;
      font-size: 1.35rem;
      letter-spacing: 1px;
      text-transform: uppercase
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 48px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      transition: border-color .15s
    }

    .search:focus-within {
      border-color: var(--accent)
    }

    .search svg {
      flex: none
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem
    }

    .search input::-webkit-search-cancel-button {
      -webkit-appearance: none
    }

    .code-n {
      color: var(--text)
    }

    .search input::placeholder {
      color: var(--dim)
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      background: var(--surface);
      border-radius: 10px
    }

    .sport-tab {
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s
    }

    .sport-tab:hover {
      color: var(--text)
    }

    .sport-tab.active {
      background: var(--text);
      color: var(--bg);
      font-weight: 600
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 40px
    }

    .section {
      margin-bottom: 24px
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 0
    }

    .link-btn.quiet {
      color: var(--dim);
      font-weight: 500
    }

    .meta {
      font-size: .8rem;
      color: var(--dim)
    }

    .sport-tag {
      display: inline-block;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-2);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 2px 6px;
      white-space: nowrap
    }

    /* Effort profile: width = time/distance, height = zone */
    .profile {
      display: flex;
      align-items: flex-end;
      gap: 1px
    }

    .profile .pseg {
      border-radius: 2px 2px 0 0;
      min-width: 1px
    }

    .profile.mini {
      height: 28px
    }

    .profile.lg {
      height: 56px;
      gap: 2px
    }

    .profile.big {
      height: 140px;
      gap: 2px;
      flex: 1;
      min-width: 0;
      border-bottom: 1px solid var(--line-2);
      background: repeating-linear-gradient(to top, transparent 0, transparent calc(20% - 1px), var(--line) calc(20% - 1px), var(--line) 20%)
    }

    .profile.big .pseg {
      cursor: pointer;
      border-radius: 3px 3px 0 0;
      transition: opacity .15s
    }

    .profile.big.has-sel .pseg:not(.sel) {
      opacity: .25
    }

    .profile-wrap {
      display: flex;
      gap: 8px
    }

    .profile-y {
      display: flex;
      flex-direction: column-reverse;
      height: 140px;
      width: 18px;
      font-size: .65rem;
      font-weight: 600;
      color: var(--faint)
    }

    .profile-y span {
      height: 20%;
      line-height: 1
    }

    .ticks {
      position: relative;
      height: 18px;
      margin: 6px 0 0 26px;
      font-variant-numeric: tabular-nums
    }

    .tick {
      position: absolute;
      top: 0;
      font-size: .7rem;
      color: var(--dim);
      transform: translateX(-50%);
      white-space: nowrap
    }

    .tick.start {
      transform: none
    }

    .tick.end {
      transform: translateX(-100%)
    }

    /* Workout cards in lists */
    .results,
    .cat-body {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s
    }

    .card:hover {
      border-color: var(--line-2);
      background: #22201C
    }

    .card-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0
    }

    .card .code {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1;
      color: var(--accent);
      min-width: 58px
    }

    .card .category {
      flex: 1;
      min-width: 0;
      font-size: .85rem;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .card .duration {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.2rem;
      white-space: nowrap
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--dim)
    }

    .empty .big {
      font-family: var(--display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px
    }

    /* Recently viewed */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 16px;
      cursor: pointer;
      transition: border-color .15s
    }

    .hero:hover {
      border-color: #4A4740
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px
    }

    .hero-code {
      font-family: var(--display);
      font-weight: 700;
      font-size: 2.6rem;
      line-height: 1;
      color: var(--accent)
    }

    .hero-cat {
      font-size: .9rem;
      color: var(--text-2);
      margin-top: 2px
    }

    .hero-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px
    }

    .hero-dur {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.8rem;
      line-height: 1
    }

    .hero-foot {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: .82rem;
      color: var(--text-2)
    }

    .hero-foot .open {
      margin-left: auto;
      color: var(--accent);
      font-weight: 600
    }

    .zchip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap
    }

    .zdot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex: none
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 8px
    }

    .recent-row {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 14px;
      width: 100%;
      text-align: left;
      background: var(--surface-2);
      border: none;
      border-radius: 4px;
      cursor: pointer
    }

    .recent-row:first-child {
      border-radius: 12px 12px 4px 4px
    }

    .recent-row:last-child {
      border-radius: 4px 4px 12px 12px
    }

    .recent-row:only-child {
      border-radius: 12px
    }

    .recent-row:hover {
      background: var(--surface)
    }

    .recent-row .code {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--accent);
      width: 58px
    }

    .recent-row .category {
      flex: 1;
      min-width: 0;
      font-size: .88rem;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .recent-row .ago {
      font-size: .8rem;
      color: var(--dim);
      white-space: nowrap
    }

    /* Category browser */
    .sport-group+.sport-group {
      margin-top: 18px
    }

    .sport-group-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px
    }

    .cat-list {
      border-top: 1px solid var(--line)
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      padding: 0 2px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      text-align: left
    }

    .cat-row .cat-name {
      flex: 1;
      font-size: .95rem;
      font-weight: 500
    }

    .cat-row .cat-count {
      font-size: .82rem;
      color: var(--dim)
    }

    .cat-row svg {
      transition: transform .2s
    }

    .cat-row.open svg {
      transform: rotate(90deg)
    }

    .cat-body {
      display: none;
      padding: 10px 0 14px
    }

    .cat-body.open {
      display: flex
    }

    /* Workout view */
    .detail {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 16px 48px
    }

    body.viewing .header,
    body.viewing .container {
      display: none
    }

    body.viewing .detail {
      display: block
    }

    .detail-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 -8px 4px
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 22px;
      color: var(--text);
      cursor: pointer
    }

    .icon-btn:hover {
      background: var(--surface)
    }

    .detail-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
      color: var(--text-2)
    }

    .detail-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px
    }

    .detail-title h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 4rem;
      line-height: 1;
      color: var(--accent)
    }

    .detail-dur {
      font-family: var(--display);
      font-weight: 600;
      font-size: 2.4rem;
      line-height: 1;
      white-space: nowrap
    }

    .profile-card {
      margin-top: 16px;
      padding: 14px 12px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px
    }

    .tl-caption {
      font-size: .8rem;
      color: var(--dim);
      margin-top: 6px;
      min-height: 1.2em
    }

    .detail-section {
      margin-top: 24px
    }

    .steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .step {
      display: grid;
      grid-template-columns: 40px 4px minmax(0, 1fr);
      align-items: center;
      column-gap: 12px;
      min-height: 52px;
      padding: 8px 14px 8px 12px;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s
    }

    .step.sel {
      border-color: var(--accent);
      background: rgba(240, 127, 42, .08)
    }

    .step-at {
      font-size: .78rem;
      font-weight: 600;
      color: var(--dim);
      font-variant-numeric: tabular-nums
    }

    .step-rail {
      width: 4px;
      align-self: stretch;
      border-radius: 2px;
      min-height: 28px
    }

    .step-body {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 12px;
      min-width: 0
    }

    .step-amt {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1;
      min-width: 64px
    }

    .step-amt small {
      font-size: .95rem;
      font-weight: 600;
      color: var(--text-2);
      margin-left: 3px
    }

    .step-zone {
      font-weight: 500
    }

    .step-target {
      margin-left: auto;
      font-size: .82rem;
      color: var(--text-2);
      background: var(--bg);
      border-radius: 6px;
      padding: 3px 8px;
      white-space: nowrap
    }

    .step-note {
      flex-basis: 100%;
      font-size: .82rem;
      color: var(--dim)
    }

    .repeat {
      border: 1px solid var(--line-2);
      border-radius: 14px;
      padding: 10px
    }

    .repeat-head {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      column-gap: 12px;
      align-items: baseline;
      padding: 0 4px 8px 2px
    }

    .repeat-head-main {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 2px 10px
    }

    .repeat-x {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--accent)
    }

    .repeat-sum {
      font-size: .82rem;
      color: var(--dim)
    }

    .repeat .step {
      background: var(--surface-2);
      border-radius: 10px
    }

    .zbar {
      display: flex;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      gap: 2px;
      margin-bottom: 12px
    }

    .zgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 14px 12px
    }

    .zstat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0
    }

    .zstat .num {
      font-size: 1.7rem;
      line-height: 1.05
    }

    .zstat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .8rem;
      color: var(--text-2)
    }

    .zstat-target {
      font-size: .78rem;
      color: var(--dim);
      overflow-wrap: anywhere
    }

    .description {
      color: var(--text-2);
      font-size: .9rem;
      line-height: 1.6
    }

    .zone-editor {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .zone-editor-title {
      font-weight: 600
    }

    .zone-editor-hint {
      color: var(--dim);
      font-size: .8rem;
      line-height: 1.45
    }

    .zone-input {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .zone-input span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 72px;
      flex: none;
      font-size: .9rem;
      font-weight: 500
    }

    .zone-input input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem
    }

    .zone-input input:focus {
      outline: none;
      border-color: var(--accent)
    }

    .zone-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px
    }

    .btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--line-2);
      background: transparent
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #141311
    }

    .share-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none
    }

    .share-hint.show {
      opacity: 1
    }

    @media(max-width:400px) {
      .detail-title h1 {
        font-size: 3.4rem
      }

      .detail-dur {
        font-size: 2rem
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand"><span class="brand-mark">80/20</span><span class="brand-name">Workouts</span></div>
      <label class="search">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A958C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" aria-label="Search workouts" placeholder="Workout code, e.g. RRe9 or CMI1" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="seg" id="sportTabs">
        <button class="sport-tab active" data-sport="All" aria-pressed="true">All</button>
        <button class="sport-tab" data-sport="Run" aria-pressed="false">Run</button>
        <button class="sport-tab" data-sport="Bike" aria-pressed="false">Bike</button>
        <button class="sport-tab" data-sport="Swim" aria-pressed="false">Swim</button>
      </div>
    </div>
  </header>
  <main class="container">
    <div id="stats"></div>
    <div id="recent"></div>
    <div class="results" id="results"></div>

    function formatDuration(d, sport) {
      if (d.includes('mi')) return d;
      if (sport === 'Swim') return d + ' yds';
      return fmtMinutes(parseInt(d));
    }

    function fmtMinutes(n) {
      if (n >= 60) { const h = Math.floor(n / 60), m = Math.round(n % 60); return m ? h + 'h ' + m + 'm' : h + 'h'; }
      return n + ' min';
    }

    function colorZones(text) {
      return text.replace(/Zone\s*(\d)/gi, (m, n) => `<span class="zone-tag z${n}">Zone ${n}</span>`);
    }

    // Codes like CMI1 and SCI4 put a capital I next to a 1, so the number gets its own color
    function fmtCode(code) {
      const m = code.match(/^(.*?)(\d+)$/);
      return m ? `${m[1]}<span class="code-n">${m[2]}</span>` : code;
    }

    function sportTag(s) {
      return `<span class="sport-tag">${s}</span>`;
    }

    function shortCategory(cat) {
      return cat.replace(/^(Running|Cycling|Swim)\s+/, '');
    }

    const ICON_BACK = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
    const ICON_SHARE = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 14v5h14v-5"/></svg>';
    const ICON_CHEVRON = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6A62" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

    // Parse a description into structured steps:
    // [{ amount, unit: 'min'|'mi'|'yds', zone: 1-5 | 0 (rest) | 'race', note }]
    // repeats are { reps, steps: [...] }
    function parseSteps(desc, sport) {
      const d = desc.replace(/\s+/g, ' ')
        .replace(/\)\s*/g, '),')
        .replace(/\s*(\d+\s*x\s*\()/gi, ',$1');
      const items = [];
      let depth = 0, cur = '';
      for (const ch of d) {
        if (ch === '(') depth++;
        if (ch === ')') depth--;
        if (ch === ',' && depth === 0) { items.push(cur); cur = ''; } else cur += ch;
      }
      items.push(cur);
      const out = [];
      for (const raw of items.map(s => s.trim()).filter(Boolean)) {
        const rep = raw.match(/^(\d+)\s*x\s*\((.*)\)$/i);
        if (rep) {
          const steps = rep[2].split(/[\/,]/).map(s => parseStep(s.trim(), sport)).filter(Boolean);
          if (steps.length) out.push({ reps: parseInt(rep[1]), steps });
        } else {
          const st = parseStep(raw, sport);
          if (st) out.push(st);
        }
      }
      return out;
    }

    function parseStep(s, sport) {
      const m = s.match(/^(\d+(?:\.\d+)?)\s*(minutes?|seconds?|"|miles?)?\s*(?:in\s+)?(?:Zone\s*(\d)|(rest)|(at race pace))\s*(.*)$/i);
      if (!m) return null;
      let amount = parseFloat(m[1]), unit;
      const u = (m[2] || '').toLowerCase();
      if (u.startsWith('second') || u === '"') { amount = amount / 60; unit = 'min'; }
      else if (u.startsWith('minute')) unit = 'min';
      else if (u.startsWith('mile')) unit = 'mi';
      else unit = sport === 'Swim' ? 'yds' : 'min';
      const zone = m[3] ? parseInt(m[3]) : m[4] ? 0 : 'race';
      return { amount, unit, zone, note: m[6].trim() };
    }

    // Flatten steps into profile segments, each tagged with the step it belongs to
    function flattenSteps(steps) {
      const segs = [];
      steps.forEach((st, i) => {
        if (st.reps) {
          for (let r = 0; r < st.reps; r++) st.steps.forEach((x, j) => segs.push({ ...x, key: i + '.' + j, rep: r + 1, reps: st.reps }));
        } else segs.push({ ...st, key: String(i) });
      });
      return segs;
    }

    function amountParts(amount, unit) {
      if (unit === 'mi') return [amount, 'mi'];
      if (unit === 'yds') return [amount, 'yds'];
      if (amount < 1) return [Math.round(amount * 60), 'sec'];
      if (amount >= 60) { const h = Math.floor(amount / 60), m = Math.round(amount % 60); return [m ? `${h}h ${m}m` : `${h}h`, '']; }
      return [+amount.toFixed(1), 'min'];
    }

    function fmtAmount(amount, unit) {
      const [n, u] = amountParts(amount, unit);
      return u ? n + ' ' + u : String(n);
    }

    function zoneLabel(z) { return z === 0 ? 'Rest' : z === 'race' ? 'Race pace' : 'Zone ' + z; }
    function zoneClass(z) { return z === 'race' ? 'tz3' : 'tz' + z; }
    const ZONE_HEIGHT = { 0: 6, 1: 20, 2: 40, 3: 60, race: 60, 4: 80, 5: 100 };

    function mainUnit(segs) {
      return segs.some(x => x.unit === 'yds') ? 'yds' : segs.some(x => x.unit === 'mi') ? 'mi' : 'min';
    }

    // Swim rests are timed while swim steps are distances, so rests get a fixed sliver instead of a share
    function segStyle(seg, unit) {
      const flex = seg.unit === unit ? `flex:${seg.amount} 0 0` : 'flex:0 0 3px';
      return `${flex};height:${ZONE_HEIGHT[seg.zone]}%`;
    }

    // Effort profile: width is time or distance, height is zone
    function renderProfile(segs, size, interactive) {
      const unit = mainUnit(segs);
      const bars = segs.map(x => `<span class="pseg ${zoneClass(x.zone)}" style="${segStyle(x, unit)}"${interactive ? ` data-key="${x.key}"${x.reps ? ` data-rep="${x.rep}"` : ''}` : ''}></span>`).join('');
      return `<span class="profile ${size}" aria-hidden="true">${bars}</span>`;
    }

    function workoutSegs(w) {
      return flattenSteps(parseSteps(w[2], w[4]));
    }

    function zoneTotals(segs) {
      const unit = mainUnit(segs);
      const totals = {};
      let restMin = 0;
      segs.forEach(x => {
        if (x.unit !== unit) { restMin += x.amount; return; }
        totals[x.zone] = (totals[x.zone] || 0) + x.amount;
      });
      const total = Object.values(totals).reduce((a, b) => a + b, 0);
      const order = [1, 2, 3, 'race', 4, 5, 0].filter(z => totals[z]);
      return { unit, totals, total, order, restMin };
    }

    function renderCard(w) {
      return `<button class="card" onclick="openWorkout('${w[0]}')">
<span class="card-top"><span class="code">${fmtCode(w[0])}</span><span class="category">${w[3]}</span><span class="duration">${formatDuration(w[1], w[4])}</span></span>
${renderProfile(workoutSegs(w), 'mini')}
</button>`;
    }

    function shareWorkout(code) {
      const url = new URL(window.location);
      url.search = '';
      url.searchParams.set('w', code);
      const hint = document.getElementById('shareHint');
      const done = () => { hint.classList.add('show'); setTimeout(() => hint.classList.remove('show'), 2000); };
      if (navigator.share) navigator.share({ title: code + ' · 80/20 Workout', url: url.toString() }).catch(() => { });
      else navigator.clipboard.writeText(url.toString()).then(done);
    }

    const searchEl = document.getElementById('search');
    const resultsEl = document.getElementById('results');
    const statsEl = document.getElementById('stats');
    const catBrowserEl = document.getElementById('categoryBrowser');
    const recentEl = document.getElementById('recent');
    const detailEl = document.getElementById('detail');
    const byCode = {};
    W.forEach(w => byCode[w[0].toLowerCase()] = w);
    let activeSport = 'All';

    // Recently viewed workouts, newest first, kept in localStorage
    const RECENT_KEY = '8020-recent';
    const RECENT_MAX = 10;

    function getRecent() {
      try {
        const list = JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
        return list.filter(r => r && byCode[String(r.code).toLowerCase()]);
      } catch (e) { return []; }
    }

    function addRecent(code) {
      const list = getRecent().filter(r => r.code !== code);
      list.unshift({ code, t: Date.now() });
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX))); } catch (e) { }
    }

    function clearRecent() {
      try { localStorage.removeItem(RECENT_KEY); } catch (e) { }
      update();
    }

    function timeAgo(t) {
      const mins = Math.floor((Date.now() - t) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const then = new Date(t), now = new Date();
      const days = Math.round((new Date(now.toDateString()) - new Date(then.toDateString())) / 86400000);
      const clock = then.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (days === 0) return 'today ' + clock;
      if (days === 1) return 'yesterday ' + clock;
      if (days < 7) return then.toLocaleDateString([], { weekday: 'short' });
      return then.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function renderRecent() {
      let list = getRecent().map(r => ({ w: byCode[r.code.toLowerCase()], t: r.t }));
      if (activeSport !== 'All') list = list.filter(r => r.w[4] === activeSport);
      if (list.length === 0) { recentEl.innerHTML = ''; return; }
      const [latest, ...rest] = list;
      const w = latest.w;
      const segs = workoutSegs(w);
      const zt = zoneTotals(segs);
      const chips = zt.order.filter(z => z !== 0).map(z => `<span class="zchip"><i class="zdot ${zoneClass(z)}"></i>${z === 'race' ? 'Race' : 'Z' + z} ${Math.round(zt.totals[z] / zt.total * 100)}%</span>`).join('');
      recentEl.innerHTML = `<div class="section">
<div class="section-head"><span class="label">Pick up where you left off</span><span class="meta">${capitalize(timeAgo(latest.t))}</span></div>
<button class="hero" onclick="openWorkout('${w[0]}')">
<span class="hero-top"><span><span class="hero-code" style="display:block">${fmtCode(w[0])}</span><span class="hero-cat" style="display:block">${w[3]}</span></span>
<span class="hero-right"><span class="hero-dur">${formatDuration(w[1], w[4])}</span>${sportTag(w[4])}</span></span>
${renderProfile(segs, 'lg')}
<span class="hero-foot">${chips}<span class="open">Open &rarr;</span></span>
</button>
${rest.length ? `<div class="recent-list">${rest.map(r => `<button class="recent-row" onclick="openWorkout('${r.w[0]}')"><span class="code">${fmtCode(r.w[0])}</span><span class="category">${r.w[3]}</span><span class="ago">${timeAgo(r.t)}</span></button>`).join('')}</div>` : ''}
<button class="link-btn quiet" onclick="clearRecent()">Clear history</button>
</div>`;
    }

    // Your own zone ranges per sport, entered once and shown on every step
    const ZONES_KEY = '8020-zones';
    const ZONE_HINTS = { Run: 'e.g. 142–150 bpm', Bike: 'e.g. 150–190 W', Swim: 'e.g. 1:55–2:05/100' };
    let detailCode = null;
    let editingZones = false;

    function getZones(sport) {
      try { return (JSON.parse(localStorage.getItem(ZONES_KEY)) || {})[sport] || {}; } catch (e) { return {}; }
    }

    function saveZones(sport, zones) {
      try {
        const all = JSON.parse(localStorage.getItem(ZONES_KEY)) || {};
        all[sport] = zones;
        localStorage.setItem(ZONES_KEY, JSON.stringify(all));
      } catch (e) { }
    }

    function esc(t) {
      return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function targetFor(z, zones) {
      return typeof z === 'number' && zones[z] ? esc(zones[z]) : '';
    }

    // Where each step starts: clock time for timed workouts, distance for swims and mile runs
    function fmtAt(v, unit) {
      if (unit === 'yds') return String(Math.round(v));
      if (unit === 'mi') return +v.toFixed(2) + ' mi';
      const h = Math.floor(v / 60), m = Math.round(v % 60);
      return h + ':' + String(m).padStart(2, '0');
    }

    function stepRow(st, key, at, zones) {
      const [n, u] = amountParts(st.amount, st.unit);
      const target = targetFor(st.zone, zones);
      return `<li class="step" data-key="${key}"><span class="step-at">${at}</span><span class="step-rail ${zoneClass(st.zone)}"></span>
<span class="step-body"><span class="step-amt">${n}<small>${u}</small></span><span class="step-zone">${zoneLabel(st.zone)}</span>${target ? `<span class="step-target">${target}</span>` : ''}${st.note ? `<span class="step-note">${esc(st.note)}</span>` : ''}</span></li>`;
    }

    function renderSteps(steps, zones, unit) {
      let pos = 0;
      const adv = x => { if (x.unit === unit) pos += x.amount; };
      return `<ol class="steps">${steps.map((st, i) => {
        const at = fmtAt(pos, unit);
        if (!st.reps) { adv(st); return stepRow(st, i, at, zones); }
        const per = st.steps.filter(x => x.unit === unit).reduce((a, x) => a + x.amount, 0);
        for (let r = 0; r < st.reps; r++) st.steps.forEach(adv);
        return `<li class="repeat"><div class="repeat-head"><span class="step-at">${at}</span><span class="repeat-head-main"><span class="repeat-x">${st.reps}&times;</span><span class="repeat-sum">${fmtAmount(per, unit)} each · ${fmtAmount(per * st.reps, unit)} total</span></span></div>
<ol class="steps">${st.steps.map((x, j) => stepRow(x, i + '.' + j, '', zones)).join('')}</ol></li>`;
      }).join('')}</ol>`;
    }

    function niceTick(total, unit) {
      const opts = unit === 'yds' ? [100, 250, 500, 1000] : unit === 'mi' ? [1, 2, 5, 10] : [5, 10, 15, 20, 30, 60];
      return opts.find(o => total / o <= 5) || opts[opts.length - 1];
    }

    function renderBigProfile(segs) {
      const unit = mainUnit(segs);
      const total = segs.filter(x => x.unit === unit).reduce((a, x) => a + x.amount, 0);
      const step = niceTick(total, unit);
      const ticks = [];
      for (let v = 0; v <= total + 1e-9; v += step) {
        const pct = v / total * 100;
        if (pct > 90 && pct < 100) continue;
        const cls = v === 0 ? ' start' : pct >= 100 ? ' end' : '';
        ticks.push(`<span class="tick${cls}" style="left:${pct}%">${fmtAt(v, unit)}</span>`);
      }
      return `<div class="profile-wrap"><div class="profile-y" aria-hidden="true"><span>Z1</span><span>Z2</span><span>Z3</span><span>Z4</span><span>Z5</span></div>
${renderProfile(segs, 'big', true)}</div><div class="ticks" aria-hidden="true">${ticks.join('')}</div>`;
    }

    function renderZoneSummary(segs, zones) {
      const { unit, totals, total, order, restMin } = zoneTotals(segs);
      const bar = order.map(z => `<div class="${zoneClass(z)}" style="flex:${totals[z]} 0 0"></div>`).join('');
      const stats = order.map(z => {
        const [n, u] = amountParts(Math.round(totals[z] * 100) / 100, unit);
        const target = targetFor(z, zones);
        return `<div class="zstat"><span class="num">${n}<small style="font-size:.9rem;color:var(--text-2);margin-left:3px">${u}</small></span>
<span class="zstat-label"><i class="zdot ${zoneClass(z)}"></i>${zoneLabel(z)} · ${Math.round(totals[z] / total * 100)}%</span>${target ? `<span class="zstat-target">${target}</span>` : ''}</div>`;
      });
      if (restMin) {
        const [n, u] = amountParts(restMin, 'min');
        stats.push(`<div class="zstat"><span class="num">${n}<small style="font-size:.9rem;color:var(--text-2);margin-left:3px">${u}</small></span><span class="zstat-label"><i class="zdot tz0"></i>Rest</span></div>`);
      }
      return `<div class="zbar" aria-hidden="true">${bar}</div><div class="zgrid">${stats.join('')}</div>`;
    }

    function renderZoneEditor(sport) {
      const zones = getZones(sport);
      return `<form class="zone-editor" onsubmit="submitZones(event)">
<div class="zone-editor-title">Your ${sport.toLowerCase()} zones</div>
<p class="zone-editor-hint">Copy your ranges from the 80/20 Zones app or the <a href="https://www.8020endurance.com/80-20-zone-calculator/" target="_blank" rel="noopener">80/20 Zone Calculator</a>. They're saved on this device and shown on every ${sport.toLowerCase()} workout.</p>
${[1, 2, 3, 4, 5].map(z => `<label class="zone-input"><span><i class="zdot tz${z}"></i>Zone ${z}</span><input name="z${z}" value="${esc(zones[z] || '')}" placeholder="${ZONE_HINTS[sport]}" autocomplete="off"></label>`).join('')}
<div class="zone-editor-actions"><button type="button" class="btn" onclick="toggleZoneEditor(false)">Cancel</button><button type="submit" class="btn primary">Save zones</button></div>
</form>`;
    }

    function submitZones(e) {
      e.preventDefault();
      const f = e.target, zones = {};
      [1, 2, 3, 4, 5].forEach(z => { const v = f['z' + z].value.trim(); if (v) zones[z] = v; });
      saveZones(byCode[detailCode.toLowerCase()][4], zones);
      toggleZoneEditor(false);
    }

    function toggleZoneEditor(on) {
      editingZones = on;
      renderDetail(byCode[detailCode.toLowerCase()]);
    }

    // Highlight a step and its profile blocks
    const CAPTION = 'Tap a block or step to see where it falls';
    let selected = null;
    function selectKey(key, rep) {
      const id = key === null ? null : key + '|' + rep;
      const already = id !== null && id === selected;
      selected = already ? null : id;
      detailEl.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
      const prof = detailEl.querySelector('.profile.big');
      const cap = detailEl.querySelector('.tl-caption');
      if (already || key === null) { prof.classList.remove('has-sel'); cap.textContent = CAPTION; return; }
      prof.classList.add('has-sel');
      detailEl.querySelectorAll(`[data-key="${key}"]`).forEach(el => {
        if (el.classList.contains('pseg') && rep !== undefined && el.dataset.rep !== String(rep)) return;
        el.classList.add('sel');
      });
      const row = detailEl.querySelector(`.step[data-key="${key}"]`);
      const [i, j] = key.split('.');
      const w = byCode[detailCode.toLowerCase()];
      const steps = parseSteps(w[2], w[4]);
      const st = j === undefined ? steps[i] : steps[i].steps[j];
      cap.textContent = (j !== undefined ? (rep !== undefined ? `Rep ${rep} of ${steps[i].reps} · ` : `All ${steps[i].reps} reps · `) : '') +
        `${fmtAmount(st.amount, st.unit)} ${zoneLabel(st.zone)}`;
      if (row && rep !== undefined) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    detailEl.addEventListener('click', e => {
      const seg = e.target.closest('.pseg[data-key]');
      if (seg) { selectKey(seg.dataset.key, seg.dataset.rep !== undefined ? +seg.dataset.rep : undefined); return; }
      const row = e.target.closest('.step[data-key]');
      if (row) selectKey(row.dataset.key);
    });

    // Workout view
    function renderDetail(w) {
      detailCode = w[0];
      selected = null;
      const steps = parseSteps(w[2], w[4]);
      const segs = flattenSteps(steps);
      const zones = getZones(w[4]);
      const hasZones = Object.keys(zones).length > 0;
      detailEl.innerHTML = `<div class="detail-bar">
<button class="icon-btn" onclick="closeWorkout()" aria-label="Back">${ICON_BACK}</button>
<button class="icon-btn" onclick="shareWorkout('${w[0]}')" aria-label="Share">${ICON_SHARE}</button>
</div>
<div class="detail-kicker">${sportTag(w[4])}<span>${w[3]}</span></div>
<div class="detail-title"><h1>${fmtCode(w[0])}</h1><span class="detail-dur">${formatDuration(w[1], w[4])}</span></div>
${segs.length ? `<div class="profile-card">${renderBigProfile(segs)}<div class="tl-caption">${CAPTION}</div></div>
<div class="detail-section"><div class="section-head"><span class="label">Steps</span></div>${renderSteps(steps, zones, mainUnit(segs))}</div>
<div class="detail-section"><div class="section-head"><span class="label">Zone breakdown</span>
<button class="link-btn" onclick="toggleZoneEditor(${!editingZones})">${hasZones ? 'Edit my zones' : 'Add my zones'}</button></div>
${editingZones ? renderZoneEditor(w[4]) : ''}
${renderZoneSummary(segs, zones)}</div>` : ''}
<div class="detail-section"><div class="section-head"><span class="label">Original description</span></div><div class="description">${colorZones(w[2])}</div></div>`;
    }

    function showView() {
      const code = new URLSearchParams(window.location.search).get('w');
      const w = code && byCode[code.toLowerCase()];
      if (w) {
        addRecent(w[0]);
        editingZones = false;
        renderDetail(w);
        document.body.classList.add('viewing');
        document.title = w[0] + ' · 80/20 Workout Library';
        window.scrollTo(0, 0);
      } else {
        document.body.classList.remove('viewing');
        document.title = '80/20 Workout Library';
        update();
      }
    }

    function openWorkout(code) {
      history.pushState({ fromList: true }, '', '?w=' + encodeURIComponent(code));
      showView();
    }

    function closeWorkout() {
      // Opened from the list: go back so the search and scroll position are restored.
      // Opened from a shared link: there's no list behind it, so show the home screen.
      if (history.state && history.state.fromList) { history.back(); return; }
      history.replaceState(null, '', window.location.pathname);
      showView();
    }

    window.addEventListener('popstate', () => { loadFromURL(); showView(); });

    function setSport(sport) {
      activeSport = sport;
      document.querySelectorAll('.sport-tab').forEach(b => {
        const on = b.dataset.sport === sport;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on);
      });
    }

    // Sport tab switching
    document.getElementById('sportTabs').addEventListener('click', e => {
      const btn = e.target.closest('.sport-tab');
      if (!btn) return;
      setSport(btn.dataset.sport);
      update();
      syncURL();
    });

    // Category browser, grouped by sport
    function renderCategoryBrowser(filtered) {
      const groups = {};
      const order = [];
      filtered.forEach(w => {
        if (!groups[w[3]]) { groups[w[3]] = []; order.push(w[3]); }
        groups[w[3]].push(w);
      });
      const sports = ['Run', 'Bike', 'Swim'].filter(s => order.some(c => groups[c][0][4] === s));
      catBrowserEl.innerHTML = `<div class="section"><div class="section-head"><span class="label">Browse</span><span class="meta">${filtered.length} workouts</span></div>
${sports.map(s => `<div class="sport-group">${activeSport === 'All' ? `<div class="sport-group-title">${s}</div>` : ''}
<div class="cat-list">${order.filter(c => groups[c][0][4] === s).map(cat => `<button class="cat-row" onclick="toggleCat(this)" aria-expanded="false"><span class="cat-name">${shortCategory(cat)}</span><span class="cat-count">${groups[cat].length}</span>${ICON_CHEVRON}</button>
<div class="cat-body">${groups[cat].map(renderCard).join('')}</div>`).join('')}</div></div>`).join('')}</div>`;
    }

    function toggleCat(el) {
      const open = el.classList.toggle('open');
      el.setAttribute('aria-expanded', open);
      el.nextElementSibling.classList.toggle('open', open);
    }

    function update() {
      const q = searchEl.value.trim().toLowerCase();
      let filtered = W;
      if (activeSport !== 'All') filtered = filtered.filter(w => w[4] === activeSport);
      if (q) {
        filtered = filtered.filter(w =>
          w[0].toLowerCase().includes(q) ||
          w[2].toLowerCase().includes(q) ||
          w[3].toLowerCase().includes(q) ||
          w[4].toLowerCase().includes(q)
        );
        catBrowserEl.innerHTML = '';
        recentEl.innerHTML = '';
        statsEl.innerHTML = `<div class="section-head"><span class="label">Results</span><span class="meta">${filtered.length} workout${filtered.length !== 1 ? 's' : ''}</span></div>`;
        resultsEl.innerHTML = filtered.length
          ? filtered.map(renderCard).join('')
          : '<div class="empty"><div class="big">No matches</div><div>Try a different code or search term</div></div>';
      } else {
        statsEl.innerHTML = '';
        resultsEl.innerHTML = '';
        renderRecent();
        renderCategoryBrowser(filtered);
      }
    }

    // URL sync: read params on load
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      searchEl.value = params.get('q') || '';
      const sport = params.get('sport') || 'All';
      setSport(['All', 'Run', 'Bike', 'Swim'].includes(sport) ? sport : 'All');
    }

    // URL sync: update params on change
    function syncURL() {
      const params = new URLSearchParams();
      const q = searchEl.value.trim();
      if (q) params.set('q', q);
      if (activeSport !== 'All') params.set('sport', activeSport);
      const newURL = params.toString() ? '?' + params.toString() : window.location.pathname;
      history.replaceState(null, '', newURL);
    }

    // Register service worker for offline/PWA
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => { }); }

    searchEl.addEventListener('input', () => { update(); syncURL(); });

    // Enter/Go opens the exact code match, or the only result
    searchEl.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = searchEl.value.trim().toLowerCase();
      if (!q) return;
      let w = byCode[q];
      if (!w) {
        const matches = W.filter(x => (activeSport === 'All' || x[4] === activeSport) && x[0].toLowerCase().startsWith(q));
        if (matches.length === 1) w = matches[0];
      }
      if (w) { searchEl.blur(); openWorkout(w[0]); }
    });

    loadFromURL();
    showView();
  </script>
</body>

</html>
