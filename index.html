<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>80/20 Workout Library</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e87f2a">
<meta property="og:title" content="80/20 Workout Library">
<meta property="og:description" content="Quick lookup for 80/20 Endurance workout codes — Run, Bike, and Swim">
<meta property="og:image" content="https://kaghaffa.github.io/80-20-training-workout-library/og-image.png">
<meta property="og:url" content="https://kaghaffa.github.io/80-20-training-workout-library/">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="80/20 Workouts">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a1a;--card:#242424;--card-hover:#2a2a2a;--text:#e0e0e0;--text-dim:#888;--orange:#e87f2a;--orange-dim:#c06a22;--border:#333;--input-bg:#2c2c2c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:#111;border-bottom:2px solid var(--orange);padding:20px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.header h1 span{color:var(--orange)}
.header p{color:var(--text-dim);font-size:.85rem;margin-bottom:16px}
.search-wrap{max-width:600px;margin:0 auto;position:relative}
.search-wrap input{width:100%;padding:12px 16px 12px 42px;border:2px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:1rem;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--orange)}
.search-wrap input::placeholder{color:var(--text-dim)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:1.1rem;pointer-events:none}
.stats{color:var(--text-dim);font-size:.8rem;margin-top:8px}
.sport-tabs{display:flex;gap:6px;justify-content:center;margin-top:12px}
.sport-tab{padding:6px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.sport-tab:hover{border-color:#555;color:var(--text)}
.sport-tab.active{border-color:var(--orange);color:var(--orange);background:rgba(232,127,42,.1)}
.sport-tab.active-run{border-color:#7bc67b;color:#7bc67b;background:rgba(45,74,45,.3)}
.sport-tab.active-bike{border-color:#7bafc6;color:#7bafc6;background:rgba(45,58,74,.3)}
.sport-tab.active-swim{border-color:#c6a67b;color:#c6a67b;background:rgba(74,58,45,.3)}
.zone-legend{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.zone-legend-item{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--text-dim)}
.zone-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.zone-legend-label{font-size:.65rem;color:var(--text-dim);margin-top:2px;text-align:center}
.container{max-width:900px;margin:0 auto;padding:16px}
.category-browser{margin-bottom:16px}
.cat-group{margin-bottom:2px}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;user-select:none}
.cat-header:hover{background:var(--card-hover);border-color:#444}
.cat-header.open{border-radius:8px 8px 0 0;border-bottom-color:transparent;background:var(--card-hover)}
.cat-header-left{display:flex;align-items:center;gap:8px}
.cat-name{font-weight:600;font-size:.9rem}
.cat-count{color:var(--text-dim);font-size:.75rem}
.cat-arrow{color:var(--text-dim);font-size:.8rem;transition:transform .2s}
.cat-header.open .cat-arrow{transform:rotate(90deg)}
.cat-body{display:none;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--card);overflow:hidden}
.cat-body.open{display:block}
.cat-body .card{border-radius:0;border-left:none;border-right:none;border-bottom:1px solid var(--border)}
.cat-body .card:last-child{border-bottom:none}
.results{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:background .15s,border-color .15s;cursor:default}
.card:hover{background:var(--card-hover);border-color:#444}
.card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.code{font-weight:700;font-size:1.15rem;color:var(--orange);font-family:'SF Mono',SFMono-Regular,Consolas,monospace}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.badge-run{background:#2d4a2d;color:#7bc67b}
.badge-bike{background:#2d3a4a;color:#7bafc6}
.badge-swim{background:#4a3a2d;color:#c6a67b}
.category{color:var(--text-dim);font-size:.85rem}
.duration{margin-left:auto;font-size:.9rem;font-weight:600;color:var(--text);white-space:nowrap}
.description{color:#bbb;font-size:.9rem;line-height:1.5}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty .big{font-size:2rem;margin-bottom:8px}
.share-btn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:3px 8px;border-radius:5px;font-size:.7rem;cursor:pointer;transition:all .2s;margin-left:8px}
.share-btn:hover{border-color:var(--orange);color:var(--orange)}
.share-btn.copied{border-color:#6bc46b;color:#6bc46b}
.share-hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:8px 20px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.share-hint.show{opacity:1}
.timeline{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-top:10px;background:#1a1a1a;gap:1px}
.timeline-seg{height:100%;min-width:2px;position:relative;transition:opacity .15s}
.timeline-seg:hover{opacity:.8}
.timeline-seg[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#111;color:var(--text);padding:3px 8px;border-radius:4px;font-size:.65rem;white-space:nowrap;z-index:5;border:1px solid var(--border);pointer-events:none}
.tz1{background:#6bc46b}.tz2{background:#4db8e0}.tz3{background:#e0c94d}.tz4{background:#e08a4d}.tz5{background:#e04d4d}.tz0{background:#555}
.zone-tag{font-weight:600}
.z1{color:#6bc46b}.z2{color:#4db8e0}.z3{color:#e0c94d}.z4{color:#e08a4d}.z5{color:#e04d4d}
@media(max-width:600px){.header{padding:14px 12px}.container{padding:10px}.card{padding:12px}.card-top{gap:6px}.duration{margin-left:0;width:100%;text-align:left}.sport-tabs{gap:4px}.sport-tab{padding:5px 12px;font-size:.7rem}.zone-legend{gap:8px}}
</style>
</head>

<button class="sport-tab" data-sport="Bike">Bike</button>
<button class="sport-tab" data-sport="Swim">Swim</button>
</div>
<div class="zone-legend">

<div class="zone-legend-item"><span class="zone-dot" style="background:#e04d4d"></span><span>Zone 5 <span style="color:#555">Max</span></span></div>
</div>
<div class="stats" id="stats"></div>
</div>
<div class="container">
<div class="category-browser" id="categoryBrowser"></div>
<div class="results" id="results"></div>
</div>
<div class="share-hint" id="shareHint">Link copied to clipboard!</div>

function formatDuration(d,sport){
if(d.includes('mi'))return d;
const n=parseInt(d);
if(sport==='Swim')return d+' yds';
if(n>=60){const h=Math.floor(n/60);const m=n%60;return m?h+'h '+m+'min':h+'h';}
return n+' min';
}

function colorZones(text){
return text.replace(/Zone\s*(\d)/gi,(m,n)=>`<span class="zone-tag z${n}">Zone ${n}</span>`);
}

function sportBadge(s){
const c=s==='Run'?'badge-run':s==='Bike'?'badge-bike':'badge-swim';
return `<span class="badge ${c}">${s}</span>`;
}

// Parse workout description into [{value, zone}] segments
function parseSegments(desc){
const segs=[];
// Normalize: remove newlines, extra spaces
let d=desc.replace(/\n/g,' ').replace(/\s+/g,' ').trim();
// Remove non-zone text like "uphill or simulated", "(25 Meter Pool Workout)", "at race pace"
d=d.replace(/uphill\s*(or\s*simulated)?/gi,'');
d=d.replace(/\(25\s*(Meter|Yard)\s*Pool\s*Workout\)/gi,'');
d=d.replace(/simulated/gi,'');

// Tokenize: split into parts handling "N x (...)" repeats
const tokens=[];
let i=0;
while(i<d.length){
// Match repeat pattern: N x (stuff)
const repMatch=d.slice(i).match(/^(\d+)\s*x\s*\(([^)]+)\)/i);
if(repMatch){
const reps=parseInt(repMatch[1]);
const inner=repMatch[2];
// Parse inner segments separated by /
const parts=inner.split('/');
for(let r=0;r<reps;r++){
parts.forEach(p=>parseSimpleSeg(p.trim(),segs));
}
i+=repMatch[0].length;
// Skip comma/space after
while(i<d.length&&(d[i]===','||d[i]===' '||d[i]===')'))i++;
continue;
}
// Match simple segment: number + optional unit + Zone N
const segMatch=d.slice(i).match(/^(\d+\.?\d*)\s*(minutes?|mins?|mi(?:les?)?|seconds?|"|\s)*(?:in\s+)?Zone\s*(\d)/i);
if(segMatch){
const val=parseFloat(segMatch[1]);
const zone=parseInt(segMatch[3]);
const unit=segMatch[2]?segMatch[2].trim():'';
// Convert seconds to minutes for display
let adjVal=val;
if(unit.match(/second/i)||unit==='"')adjVal=val/60;
segs.push({value:adjVal,zone});
i+=segMatch[0].length;
while(i<d.length&&(d[i]===','||d[i]===' '))i++;
continue;
}
// Match "at race pace" segments like "16 miles at race pace"
const raceMatch=d.slice(i).match(/^(\d+\.?\d*)\s*(miles?|mi)\s+at\s+race\s+pace/i);
if(raceMatch){
segs.push({value:parseFloat(raceMatch[1]),zone:3});
i+=raceMatch[0].length;
while(i<d.length&&(d[i]===','||d[i]===' '))i++;
continue;
}
// Match "rest" segments
const restMatch=d.slice(i).match(/^(\d+\.?\d*)\s*(minutes?|seconds?|")\s*rest/i);
if(restMatch){
const val=parseFloat(restMatch[1]);
const unit=restMatch[2];
let adjVal=val;
if(unit.match(/second/i)||unit==='"')adjVal=val/60;
segs.push({value:adjVal,zone:0});
i+=restMatch[0].length;
while(i<d.length&&(d[i]===','||d[i]===' '))i++;
continue;
}
i++;
}
return segs;
}

function parseSimpleSeg(s,segs){
// "1 minute Zone 5 uphill" or "2 minutes Zone 1" or "100 Zone 3" or "50 Zone 1"
const m=s.match(/(\d+\.?\d*)\s*(minutes?|mins?|seconds?|"|\s)*(?:in\s+)?Zone\s*(\d)/i);
if(m){
const val=parseFloat(m[1]);
const zone=parseInt(m[3]);
const unit=m[2]?m[2].trim():'';
let adjVal=val;
if(unit.match(/second/i)||unit==='"')adjVal=val/60;
segs.push({value:adjVal,zone});
}
// Check for rest
const r=s.match(/(\d+\.?\d*)\s*(minutes?|seconds?|")\s*rest/i);
if(r&&!m){
const val=parseFloat(r[1]);
const unit=r[2];
let adjVal=val;
if(unit.match(/second/i)||unit==='"')adjVal=val/60;
segs.push({value:adjVal,zone:0});
}
}

function renderTimeline(desc){
const segs=parseSegments(desc);
if(segs.length===0)return '';
const total=segs.reduce((s,x)=>s+x.value,0);
if(total===0)return '';
const bars=segs.map(s=>{
const pct=(s.value/total*100);
const minPct=Math.max(pct,0.5);
const zClass=s.zone>=1&&s.zone<=5?'tz'+s.zone:'tz0';
const label=s.zone?'Zone '+s.zone:'Rest';
const durLabel=s.value>=1?Math.round(s.value)+'':'<1';
return `<div class="timeline-seg ${zClass}" style="width:${minPct}%" data-tooltip="${label} (${durLabel})"></div>`;
}).join('');
return `<div class="timeline">${bars}</div>`;
}

function renderCard(w){
return `<div class="card">
<div class="card-top">
<span class="code">${w[0]}</span>
${sportBadge(w[4])}
<span class="category">${w[3]}</span>
<button class="share-btn" onclick="shareWorkout('${w[0]}',this,event)">&#128279; Share</button>
<span class="duration">${formatDuration(w[1],w[4])}</span>
</div>
<div class="description">${colorZones(w[2])}</div>
${renderTimeline(w[2])}
</div>`;
}

function shareWorkout(code,btn,e){
e.stopPropagation();
const url=new URL(window.location);
url.searchParams.set('q',code);
url.searchParams.delete('sport');
const link=url.toString();
navigator.clipboard.writeText(link).then(()=>{
btn.textContent='Copied!';
btn.classList.add('copied');
const hint=document.getElementById('shareHint');
hint.classList.add('show');
setTimeout(()=>{hint.classList.remove('show');btn.innerHTML='&#128279; Share';btn.classList.remove('copied');},2000);
});
}

const searchEl=document.getElementById('search');
const resultsEl=document.getElementById('results');
const statsEl=document.getElementById('stats');
const catBrowserEl=document.getElementById('categoryBrowser');
let activeSport='All';

// Sport tab switching
document.getElementById('sportTabs').addEventListener('click',e=>{
const btn=e.target.closest('.sport-tab');
if(!btn)return;
document.querySelectorAll('.sport-tab').forEach(b=>{b.classList.remove('active','active-run','active-bike','active-swim')});
activeSport=btn.dataset.sport;
if(activeSport==='All')btn.classList.add('active');
else btn.classList.add('active','active-'+activeSport.toLowerCase());
update();
});

// Build category groups
function getCategoriesForSport(sport){
const cats=[];
const seen=new Set();
const list=sport==='All'?W:W.filter(w=>w[4]===sport);
list.forEach(w=>{
if(!seen.has(w[3])){seen.add(w[3]);cats.push(w[3])}
});
return cats;
}

function renderCategoryBrowser(filtered){
const sport=activeSport;
const cats=getCategoriesForSport(sport);
if(cats.length===0){catBrowserEl.innerHTML='';return;}
// Group filtered workouts by category
const groups={};
filtered.forEach(w=>{
if(!groups[w[3]])groups[w[3]]=[];
groups[w[3]].push(w);
});
catBrowserEl.innerHTML=cats.filter(c=>groups[c]).map(cat=>{
const workouts=groups[cat]||[];
const badge=workouts[0]?sportBadge(workouts[0][4]):'';
return `<div class="cat-group">
<div class="cat-header" onclick="toggleCat(this)">
<div class="cat-header-left">${badge}<span class="cat-name">${cat}</span><span class="cat-count">${workouts.length} workout${workouts.length!==1?'s':''}</span></div>
<span class="cat-arrow">&#9654;</span>
</div>
<div class="cat-body">${workouts.map(renderCard).join('')}</div>
</div>`;
}).join('');
}

function toggleCat(el){
el.classList.toggle('open');
el.nextElementSibling.classList.toggle('open');
}

function update(){
const q=searchEl.value.trim().toLowerCase();
let filtered=W;
// Apply sport filter
if(activeSport!=='All'){
filtered=filtered.filter(w=>w[4]===activeSport);
}
// Apply search query
if(q){
filtered=filtered.filter(w=>
w[0].toLowerCase().includes(q)||
w[2].toLowerCase().includes(q)||
w[3].toLowerCase().includes(q)||
w[4].toLowerCase().includes(q)
);
}
const total=activeSport==='All'?W.length:W.filter(w=>w[4]===activeSport).length;
statsEl.textContent=`Showing ${filtered.length} of ${total} workouts`;
if(q){
// Search mode: show flat results
catBrowserEl.innerHTML='';
if(filtered.length===0){
resultsEl.innerHTML='<div class="empty"><div class="big">No matches</div><div>Try a different search term</div></div>';
}else{
resultsEl.innerHTML=filtered.map(renderCard).join('');
}
}else{
// Browse mode: show category groups
resultsEl.innerHTML='';
renderCategoryBrowser(filtered);
}
}

// URL sync: read params on load
function loadFromURL(){
const params=new URLSearchParams(window.location.search);
const q=params.get('q')||'';
const sport=params.get('sport')||'All';
searchEl.value=q;
if(['All','Run','Bike','Swim'].includes(sport)){
activeSport=sport;
document.querySelectorAll('.sport-tab').forEach(b=>{
b.classList.remove('active','active-run','active-bike','active-swim');
if(b.dataset.sport===sport){
if(sport==='All')b.classList.add('active');
else b.classList.add('active','active-'+sport.toLowerCase());
}
});
}
}

// URL sync: update params on change
function syncURL(){
const params=new URLSearchParams();
const q=searchEl.value.trim();
if(q)params.set('q',q);
if(activeSport!=='All')params.set('sport',activeSport);
const newURL=params.toString()?'?'+params.toString():window.location.pathname;
history.replaceState(null,'',newURL);
}

// Register service worker for offline/PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

searchEl.addEventListener('input',()=>{update();syncURL();});

// Also sync URL on sport tab click
const origTabHandler=document.getElementById('sportTabs');
origTabHandler.addEventListener('click',()=>setTimeout(syncURL,0));

loadFromURL();
update();
</script>
</body>
</html>
