<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80/20 Workout Library</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e87f2a">
  <meta property="og:title" content="80/20 Workout Library">
  <meta property="og:description" content="Quick lookup for 80/20 Endurance workout codes — Run, Bike, and Swim">
  <meta property="og:image" content="https://kaghaffa.github.io/80-20-training-workout-library/og-image.png">
  <meta property="og:url" content="https://kaghaffa.github.io/80-20-training-workout-library/">
  <meta property="og:type" content="website">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="80/20 Workouts">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --card-hover: #2a2a2a;
      --text: #e0e0e0;
      --text-dim: #888;
      --orange: #e87f2a;
      --orange-dim: #c06a22;
      --border: #333;
      --input-bg: #2c2c2c
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh
    }

    .header {
      background: #111;
      border-bottom: 2px solid var(--orange);
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px
    }

    .header h1 span {
      color: var(--orange)
    }

    .header p {
      color: var(--text-dim);
      font-size: .85rem;
      margin-bottom: 16px
    }

    .search-wrap {
      max-width: 600px;
      margin: 0 auto;
      position: relative
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s
    }

    .search-wrap input:focus {
      border-color: var(--orange)
    }

    .search-wrap input::placeholder {
      color: var(--text-dim)
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
      pointer-events: none
    }

    .stats {
      color: var(--text-dim);
      font-size: .8rem;
      margin-top: 8px
    }

    .sport-tabs {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 12px
    }

    .sport-tab {
      padding: 6px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .sport-tab:hover {
      border-color: #555;
      color: var(--text)
    }

    .sport-tab.active {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(232, 127, 42, .1)
    }

    .sport-tab.active-run {
      border-color: #7bc67b;
      color: #7bc67b;
      background: rgba(45, 74, 45, .3)
    }

    .sport-tab.active-bike {
      border-color: #7bafc6;
      color: #7bafc6;
      background: rgba(45, 58, 74, .3)
    }

    .sport-tab.active-swim {
      border-color: #c6a67b;
      color: #c6a67b;
      background: rgba(74, 58, 45, .3)
    }

    .zone-legend {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .zone-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: .75rem;
      color: var(--text-dim)
    }

    .zone-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block
    }

    .zone-legend-label {
      font-size: .65rem;
      color: var(--text-dim);
      margin-top: 2px;
      text-align: center
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px
    }

    .category-browser {
      margin-bottom: 16px
    }

    .cat-group {
      margin-bottom: 2px
    }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      user-select: none
    }

    .cat-header:hover {
      background: var(--card-hover);
      border-color: #444
    }

    .cat-header.open {
      border-radius: 8px 8px 0 0;
      border-bottom-color: transparent;
      background: var(--card-hover)
    }

    .cat-header-left {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .cat-name {
      font-weight: 600;
      font-size: .9rem
    }

    .cat-count {
      color: var(--text-dim);
      font-size: .75rem
    }

    .cat-arrow {
      color: var(--text-dim);
      font-size: .8rem;
      transition: transform .2s
    }

    .cat-header.open .cat-arrow {
      transform: rotate(90deg)
    }

    .cat-body {
      display: none;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      background: var(--card);
      overflow: hidden
    }

    .cat-body.open {
      display: block
    }

    .cat-body .card {
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: 1px solid var(--border)
    }

    .cat-body .card:last-child {
      border-bottom: none
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: background .15s, border-color .15s;
      cursor: pointer
    }

    .card:hover {
      background: var(--card-hover);
      border-color: #444
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px
    }

    .code {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--orange);
      font-family: 'SF Mono', SFMono-Regular, Consolas, monospace
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .badge-run {
      background: #2d4a2d;
      color: #7bc67b
    }

    .badge-bike {
      background: #2d3a4a;
      color: #7bafc6
    }

    .badge-swim {
      background: #4a3a2d;
      color: #c6a67b
    }

    .category {
      color: var(--text-dim);
      font-size: .85rem
    }

    .duration {
      margin-left: auto;
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap
    }

    .description {
      color: #bbb;
      font-size: .9rem;
      line-height: 1.5
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim)
    }

    .empty .big {
      font-size: 2rem;
      margin-bottom: 8px
    }

    .share-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: .7rem;
      cursor: pointer;
      transition: all .2s;
      margin-left: 8px
    }

    .share-btn:hover {
      border-color: var(--orange);
      color: var(--orange)
    }

    .share-btn.copied {
      border-color: #6bc46b;
      color: #6bc46b
    }

    .share-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--orange);
      color: #111;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none
    }

    .share-hint.show {
      opacity: 1
    }

    .timeline {
      display: flex;
      height: 14px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
      background: #1a1a1a;
      gap: 1px
    }

    .timeline-seg {
      height: 100%;
      min-width: 2px;
      position: relative;
      transition: opacity .15s
    }

    .timeline-seg:hover {
      opacity: .8
    }

    .timeline-seg[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--text);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: .65rem;
      white-space: nowrap;
      z-index: 5;
      border: 1px solid var(--border);
      pointer-events: none
    }

    .tz1 {
      background: #6bc46b
    }

    .tz2 {
      background: #4db8e0
    }

    .tz3 {
      background: #e0c94d
    }

    .tz4 {
      background: #e08a4d
    }

    .tz5 {
      background: #e04d4d
    }

    .tz0 {
      background: #555
    }

    .zone-tag {
      font-weight: 600
    }

    .z1 {
      color: #6bc46b
    }

    .z2 {
      color: #4db8e0
    }

    .z3 {
      color: #e0c94d
    }

    .z4 {
      color: #e08a4d
    }

    .z5 {
      color: #e04d4d
    }

    .recent {
      margin-bottom: 16px
    }

    .recent-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .recent-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-dim)
    }

    .recent-clear {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: .75rem;
      cursor: pointer;
      padding: 2px 4px
    }

    .recent-clear:hover {
      color: var(--orange)
    }

    .recent-when {
      color: var(--text-dim);
      font-size: .75rem;
      margin-bottom: 6px
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 8px
    }

    .recent-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font: inherit;
      width: 100%
    }

    .recent-row:hover {
      background: var(--card-hover);
      border-color: #444
    }

    .recent-row .code {
      font-size: .95rem;
      min-width: 52px
    }

    .recent-row .category {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .recent-row .ago {
      color: var(--text-dim);
      font-size: .75rem;
      white-space: nowrap
    }

    .detail {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px
    }

    body.viewing .header,
    body.viewing .container {
      display: none
    }

    body.viewing .detail {
      display: block
    }

    .detail-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px
    }

    .back-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: .9rem;
      cursor: pointer
    }

    .back-btn:hover {
      border-color: var(--orange);
      color: var(--orange)
    }

    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px
    }

    .detail-card .card-top {
      margin-bottom: 4px
    }

    .detail-card .code {
      font-size: 2rem
    }

    .detail-duration {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 12px 0
    }

    .detail-card .description {
      font-size: 1.05rem;
      line-height: 1.7
    }

    .timeline.big {
      height: 36px;
      margin-top: 16px;
      border-radius: 6px
    }

    .timeline.big .timeline-seg {
      cursor: pointer
    }

    .timeline.big.has-sel .timeline-seg:not(.sel) {
      opacity: .25
    }

    .ticks {
      position: relative;
      height: 18px;
      margin-top: 4px
    }

    .tick {
      position: absolute;
      top: 0;
      font-size: .7rem;
      color: var(--text-dim);
      transform: translateX(-50%);
      white-space: nowrap
    }

    .tick[style="left:0%"] {
      transform: none
    }

    .tick.end {
      transform: translateX(-100%)
    }

    .tl-caption {
      font-size: .8rem;
      color: var(--text-dim);
      margin-top: 6px;
      min-height: 1.2em
    }

    .detail-section {
      margin-top: 20px
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px
    }

    .section-title {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-dim);
      margin-bottom: 8px
    }

    .section-head .section-title {
      margin-bottom: 0
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--orange);
      font-size: .85rem;
      cursor: pointer;
      padding: 4px 0
    }

    .steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .step {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, background .15s
    }

    .step.sel {
      border-color: var(--orange);
      background: rgba(232, 127, 42, .08)
    }

    .step-num {
      color: var(--text-dim);
      font-size: .8rem;
      font-weight: 700;
      min-width: 14px
    }

    .step-amt {
      font-size: 1.1rem;
      font-weight: 700;
      min-width: 72px
    }

    .step-zone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600
    }

    .zdot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex: none
    }

    .step-target {
      color: var(--text);
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: .85rem
    }

    .step-note {
      color: var(--text-dim);
      font-size: .85rem
    }

    .repeat {
      border: 1px dashed #555;
      border-radius: 12px;
      padding: 10px
    }

    .repeat-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 2px 4px 10px
    }

    .repeat-x {
      font-weight: 700;
      color: var(--orange)
    }

    .repeat-sum {
      color: var(--text-dim);
      font-size: .8rem
    }

    .zsum {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px
    }

    .zsum-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 96px;
      align-items: center;
      gap: 12px
    }

    .zsum-label {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
      font-size: .9rem
    }

    .zsum-label .step-target {
      font-size: .75rem
    }

    .zsum-bar {
      height: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      overflow: hidden
    }

    .zsum-bar div {
      height: 100%
    }

    .zsum-amt {
      font-size: .85rem;
      font-weight: 600;
      text-align: right;
      white-space: nowrap
    }

    .zsum-amt span {
      color: var(--text-dim);
      font-weight: 400
    }

    .zone-editor {
      background: var(--card);
      border: 1px solid var(--orange);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .zone-editor-title {
      font-weight: 700
    }

    .zone-editor-hint {
      color: var(--text-dim);
      font-size: .8rem;
      line-height: 1.4
    }

    .zone-editor-hint a {
      color: var(--orange)
    }

    .zone-input {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .zone-input span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: 70px;
      flex: none;
      font-size: .9rem;
      font-weight: 600
    }

    .zone-input input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem
    }

    .zone-input input:focus {
      outline: none;
      border-color: var(--orange)
    }

    .zone-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px
    }

    .save-btn {
      background: var(--orange);
      border: none;
      color: #111;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: .9rem;
      cursor: pointer
    }

    .detail .share-btn {
      margin-left: 0;
      padding: 8px 14px;
      font-size: .85rem
    }

    @media(max-width:600px) {
      .header {
        padding: 14px 12px
      }

      .container {
        padding: 10px
      }

      .card {
        padding: 12px
      }

      .card-top {
        gap: 6px
      }

      .duration {
        margin-left: 0;
        width: 100%;
        text-align: left
      }

      .sport-tabs {
        gap: 4px
      }

      .sport-tab {
        padding: 5px 12px;
        font-size: .7rem
      }

      .zone-legend {
        gap: 8px
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1><span>80/20</span> Workout Library</h1>
    <p>Search by workout code, sport, or category</p>
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search" placeholder="Type a workout code (e.g. RRe9, CF5, SCI3)..." enterkeyhint="go" autofocus>
    </div>
    <div class="sport-tabs" id="sportTabs">
      <button class="sport-tab active" data-sport="All">All</button>
      <button class="sport-tab" data-sport="Run">Run</button>
      <button class="sport-tab" data-sport="Bike">Bike</button>
      <button class="sport-tab" data-sport="Swim">Swim</button>
    </div>
    <div class="zone-legend">
      <div class="zone-legend-item"><span class="zone-dot" style="background:#6bc46b"></span><span>Zone 1 <span
            style="color:#555">Easy</span></span></div>
      <div class="zone-legend-item"><span class="zone-dot" style="background:#4db8e0"></span><span>Zone 2 <span
            style="color:#555">Moderate</span></span></div>
      <div class="zone-legend-item"><span class="zone-dot" style="background:#e0c94d"></span><span>Zone 3 <span
            style="color:#555">Tempo</span></span></div>
      <div class="zone-legend-item"><span class="zone-dot" style="background:#e08a4d"></span><span>Zone 4 <span
            style="color:#555">Threshold</span></span></div>
      <div class="zone-legend-item"><span class="zone-dot" style="background:#e04d4d"></span><span>Zone 5 <span
            style="color:#555">Max</span></span></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="container">
    <div class="recent" id="recent"></div>
    <div class="category-browser" id="categoryBrowser"></div>
    <div class="results" id="results"></div>
  </div>
  <div class="detail" id="detail"></div>
  <div class="share-hint" id="shareHint">Link copied to clipboard!</div>
  <script>
    const W = [
      // Running Recovery
      ["RRe1", "20", "20 minutes Zone 1", "Running Recovery", "Run"],
      ["RRe2", "25", "25 minutes Zone 1", "Running Recovery", "Run"],
      ["RRe3", "30", "30 minutes Zone 1", "Running Recovery", "Run"],
      ["RRe4", "35", "35 minutes Zone 1", "Running Recovery", "Run"],
      ["RRe5", "40", "40 minutes Zone 1", "Running Recovery", "Run"],
      ["RRe6", "45", "45 minutes Zone 1", "Running Recovery", "Run"],

    function formatDuration(d, sport) {
      if (d.includes('mi')) return d;
      const n = parseInt(d);
      if (sport === 'Swim') return d + ' yds';
      if (n >= 60) { const h = Math.floor(n / 60); const m = n % 60; return m ? h + 'h ' + m + 'min' : h + 'h'; }
      return n + ' min';
    }

    function colorZones(text) {
      return text.replace(/Zone\s*(\d)/gi, (m, n) => `<span class="zone-tag z${n}">Zone ${n}</span>`);
    }

    function sportBadge(s) {
      const c = s === 'Run' ? 'badge-run' : s === 'Bike' ? 'badge-bike' : 'badge-swim';
      return `<span class="badge ${c}">${s}</span>`;
    }

    // Parse a description into structured steps:
    // [{ amount, unit: 'min'|'mi'|'yds', zone: 1-5 | 0 (rest) | 'race', note }]
    // repeats are { reps, steps: [...] }
    function parseSteps(desc, sport) {
      const d = desc.replace(/\s+/g, ' ')
        .replace(/\)\s*/g, '),')
        .replace(/\s*(\d+\s*x\s*\()/gi, ',$1');
      const items = [];
      let depth = 0, cur = '';
      for (const ch of d) {
        if (ch === '(') depth++;
        if (ch === ')') depth--;
        if (ch === ',' && depth === 0) { items.push(cur); cur = ''; } else cur += ch;
      }
      items.push(cur);
      const out = [];
      for (const raw of items.map(s => s.trim()).filter(Boolean)) {
        const rep = raw.match(/^(\d+)\s*x\s*\((.*)\)$/i);
        if (rep) {
          const steps = rep[2].split(/[\/,]/).map(s => parseStep(s.trim(), sport)).filter(Boolean);
          if (steps.length) out.push({ reps: parseInt(rep[1]), steps });
        } else {
          const st = parseStep(raw, sport);
          if (st) out.push(st);
        }
      }
      return out;
    }

    function parseStep(s, sport) {
      const m = s.match(/^(\d+(?:\.\d+)?)\s*(minutes?|seconds?|"|miles?)?\s*(?:in\s+)?(?:Zone\s*(\d)|(rest)|(at race pace))\s*(.*)$/i);
      if (!m) return null;
      let amount = parseFloat(m[1]), unit;
      const u = (m[2] || '').toLowerCase();
      if (u.startsWith('second') || u === '"') { amount = amount / 60; unit = 'min'; }
      else if (u.startsWith('minute')) unit = 'min';
      else if (u.startsWith('mile')) unit = 'mi';
      else unit = sport === 'Swim' ? 'yds' : 'min';
      const zone = m[3] ? parseInt(m[3]) : m[4] ? 0 : 'race';
      return { amount, unit, zone, note: m[6].trim() };
    }

    // Flatten steps into timeline segments, each tagged with the step it belongs to
    function flattenSteps(steps) {
      const segs = [];
      steps.forEach((st, i) => {
        if (st.reps) {
          for (let r = 0; r < st.reps; r++) st.steps.forEach((x, j) => segs.push({ ...x, key: i + '.' + j, rep: r + 1, reps: st.reps }));
        } else segs.push({ ...st, key: String(i) });
      });
      return segs;
    }

    function fmtAmount(amount, unit) {
      if (unit === 'mi') return amount + ' mi';
      if (unit === 'yds') return amount + ' yds';
      if (amount < 1) return Math.round(amount * 60) + ' sec';
      if (amount >= 60) { const h = Math.floor(amount / 60), m = Math.round(amount % 60); return m ? h + 'h ' + m + 'min' : h + 'h'; }
      return +amount.toFixed(1) + ' min';
    }

    function zoneLabel(z) { return z === 0 ? 'Rest' : z === 'race' ? 'Race pace' : 'Zone ' + z; }
    function zoneClass(z) { return z === 'race' ? 'tz3' : 'tz' + z; }

    // Swim rests are timed while swim steps are distances, so rests get a fixed sliver instead of a share
    function segFlex(seg, mainUnit) {
      return seg.unit === mainUnit ? `flex:${seg.amount} 0 0` : 'flex:0 0 3px';
    }

    function mainUnit(segs) {
      return segs.some(x => x.unit === 'yds') ? 'yds' : segs.some(x => x.unit === 'mi') ? 'mi' : 'min';
    }

    function renderTimeline(desc, sport) {
      const segs = flattenSteps(parseSteps(desc, sport));
      if (segs.length === 0) return '';
      const unit = mainUnit(segs);
      return `<div class="timeline">${segs.map(x => `<div class="timeline-seg ${zoneClass(x.zone)}" style="${segFlex(x, unit)}" data-tooltip="${zoneLabel(x.zone)} (${fmtAmount(x.amount, x.unit)})"></div>`).join('')}</div>`;
    }

    function renderCard(w) {
      return `<div class="card" onclick="openWorkout('${w[0]}')">
<div class="card-top">
<span class="code">${w[0]}</span>
${sportBadge(w[4])}
<span class="category">${w[3]}</span>
<button class="share-btn" onclick="shareWorkout('${w[0]}',this,event)">&#128279; Share</button>
<span class="duration">${formatDuration(w[1], w[4])}</span>
</div>
<div class="description">${colorZones(w[2])}</div>
${renderTimeline(w[2], w[4])}
</div>`;
    }

    function shareWorkout(code, btn, e) {
      e.stopPropagation();
      const url = new URL(window.location);
      url.search = '';
      url.searchParams.set('w', code);
      const link = url.toString();
      navigator.clipboard.writeText(link).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        const hint = document.getElementById('shareHint');
        hint.classList.add('show');
        setTimeout(() => { hint.classList.remove('show'); btn.innerHTML = '&#128279; Share'; btn.classList.remove('copied'); }, 2000);
      });
    }

    const searchEl = document.getElementById('search');
    const resultsEl = document.getElementById('results');
    const statsEl = document.getElementById('stats');
    const catBrowserEl = document.getElementById('categoryBrowser');
    const recentEl = document.getElementById('recent');
    const detailEl = document.getElementById('detail');
    const byCode = {};
    W.forEach(w => byCode[w[0].toLowerCase()] = w);
    let activeSport = 'All';

    // Recently viewed workouts, newest first, kept in localStorage
    const RECENT_KEY = '8020-recent';
    const RECENT_MAX = 10;

    function getRecent() {
      try {
        const list = JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
        return list.filter(r => r && byCode[String(r.code).toLowerCase()]);
      } catch (e) { return []; }
    }

    function addRecent(code) {
      const list = getRecent().filter(r => r.code !== code);
      list.unshift({ code, t: Date.now() });
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX))); } catch (e) { }
    }

    function clearRecent() {
      try { localStorage.removeItem(RECENT_KEY); } catch (e) { }
      update();
    }

    function timeAgo(t) {
      const mins = Math.floor((Date.now() - t) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const then = new Date(t), now = new Date();
      const days = Math.round((new Date(now.toDateString()) - new Date(then.toDateString())) / 86400000);
      const clock = then.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (days === 0) return 'today ' + clock;
      if (days === 1) return 'yesterday ' + clock;
      if (days < 7) return days + ' days ago';
      return then.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function renderRecent() {
      let list = getRecent().map(r => ({ w: byCode[r.code.toLowerCase()], t: r.t }));
      if (activeSport !== 'All') list = list.filter(r => r.w[4] === activeSport);
      if (list.length === 0) { recentEl.innerHTML = ''; return; }
      const [latest, ...rest] = list;
      recentEl.innerHTML = `<div class="recent-head"><span class="recent-title">Recently viewed</span><button class="recent-clear" onclick="clearRecent()">Clear</button></div>
<div class="recent-when">Viewed ${timeAgo(latest.t)}</div>
${renderCard(latest.w)}
${rest.length ? `<div class="recent-list">${rest.map(r => `<button class="recent-row" onclick="openWorkout('${r.w[0]}')"><span class="code">${r.w[0]}</span>${sportBadge(r.w[4])}<span class="category">${r.w[3]}</span><span class="ago">${timeAgo(r.t)}</span></button>`).join('')}</div>` : ''}`;
    }

    // Your own zone ranges per sport, entered once and shown on every step
    const ZONES_KEY = '8020-zones';
    const ZONE_HINTS = { Run: 'e.g. 142–150 bpm', Bike: 'e.g. 150–190 W', Swim: 'e.g. 1:55–2:05/100' };
    let detailCode = null;
    let editingZones = false;

    function getZones(sport) {
      try { return (JSON.parse(localStorage.getItem(ZONES_KEY)) || {})[sport] || {}; } catch (e) { return {}; }
    }

    function saveZones(sport, zones) {
      try {
        const all = JSON.parse(localStorage.getItem(ZONES_KEY)) || {};
        all[sport] = zones;
        localStorage.setItem(ZONES_KEY, JSON.stringify(all));
      } catch (e) { }
    }

    function esc(t) {
      return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function zoneTag(z, zones) {
      const target = typeof z === 'number' && zones[z] ? `<span class="step-target">${esc(zones[z])}</span>` : '';
      return `<span class="step-zone"><i class="zdot ${zoneClass(z)}"></i>${zoneLabel(z)}</span>${target}`;
    }

    function stepRow(st, key, num, zones) {
      return `<li class="step" data-key="${key}"><span class="step-num">${num}</span><span class="step-amt">${fmtAmount(st.amount, st.unit)}</span>${zoneTag(st.zone, zones)}${st.note ? `<span class="step-note">${esc(st.note)}</span>` : ''}</li>`;
    }

    function renderSteps(steps, zones) {
      return `<ol class="steps">${steps.map((st, i) => {
        if (!st.reps) return stepRow(st, i, i + 1, zones);
        const unit = mainUnit(st.steps);
        const per = st.steps.filter(x => x.unit === unit).reduce((a, x) => a + x.amount, 0);
        return `<li class="repeat"><div class="repeat-head"><span class="step-num">${i + 1}</span><span class="repeat-x">Repeat ${st.reps}×</span><span class="repeat-sum">${fmtAmount(per, unit)} each · ${fmtAmount(per * st.reps, unit)} total</span></div>
<ol class="steps">${st.steps.map((x, j) => stepRow(x, i + '.' + j, String.fromCharCode(97 + j), zones)).join('')}</ol></li>`;
      }).join('')}</ol>`;
    }

    function niceTick(total, unit) {
      const opts = unit === 'yds' ? [100, 250, 500, 1000] : unit === 'mi' ? [1, 2, 5, 10] : [5, 10, 15, 20, 30, 60];
      return opts.find(o => total / o <= 6) || opts[opts.length - 1];
    }

    function tickLabel(v, unit) {
      if (unit === 'yds') return v;
      if (unit === 'mi') return v + ' mi';
      if (v === 0) return '0';
      const h = Math.floor(v / 60), m = v % 60;
      return h ? (m ? `${h}h${m}` : `${h}h`) : `${m}m`;
    }

    function renderBigTimeline(segs) {
      const unit = mainUnit(segs);
      const total = segs.filter(x => x.unit === unit).reduce((a, x) => a + x.amount, 0);
      const bars = segs.map(x => `<div class="timeline-seg ${zoneClass(x.zone)}" style="${segFlex(x, unit)}" data-key="${x.key}"${x.reps ? ` data-rep="${x.rep}"` : ''}></div>`).join('');
      const step = niceTick(total, unit);
      const ticks = [];
      for (let v = 0; v <= total + 1e-9; v += step) {
        const pct = v / total * 100;
        const cls = pct > 92 ? ' end' : '';
        if (pct > 92 && pct < 100) continue;
        ticks.push(`<span class="tick${cls}" style="left:${pct}%">${tickLabel(v, unit)}</span>`);
      }
      return `<div class="timeline big">${bars}</div><div class="ticks">${ticks.join('')}</div>`;
    }

    function renderZoneSummary(segs, zones) {
      const unit = mainUnit(segs);
      const totals = {};
      let restMin = 0;
      segs.forEach(x => {
        if (x.unit !== unit) { restMin += x.amount; return; }
        totals[x.zone] = (totals[x.zone] || 0) + x.amount;
      });
      const total = Object.values(totals).reduce((a, b) => a + b, 0);
      const order = [1, 2, 3, 'race', 4, 5, 0].filter(z => totals[z]);
      const rows = order.map(z => {
        const pct = totals[z] / total * 100;
        return `<div class="zsum-row"><div class="zsum-label">${zoneTag(z, zones)}</div>
<div class="zsum-bar"><div class="${zoneClass(z)}" style="width:${pct}%"></div></div>
<div class="zsum-amt">${fmtAmount(Math.round(totals[z] * 100) / 100, unit)}<span> · ${Math.round(pct)}%</span></div></div>`;
      });
      if (restMin) rows.push(`<div class="zsum-row"><div class="zsum-label">${zoneTag(0, zones)}</div><div class="zsum-bar"></div><div class="zsum-amt">${fmtAmount(restMin, 'min')}</div></div>`);
      return `<div class="zsum">${rows.join('')}</div>`;
    }

    function renderZoneEditor(sport) {
      const zones = getZones(sport);
      return `<form class="zone-editor" onsubmit="submitZones(event)">
<div class="zone-editor-title">Your ${sport.toLowerCase()} zones</div>
<p class="zone-editor-hint">Copy your ranges from the 80/20 Zones app or the <a href="https://www.8020endurance.com/80-20-zone-calculator/" target="_blank" rel="noopener">80/20 Zone Calculator</a>. They're saved on this device and shown on every ${sport.toLowerCase()} workout.</p>
${[1, 2, 3, 4, 5].map(z => `<label class="zone-input"><span><i class="zdot tz${z}"></i>Zone ${z}</span><input name="z${z}" value="${esc(zones[z] || '')}" placeholder="${ZONE_HINTS[sport]}" autocomplete="off"></label>`).join('')}
<div class="zone-editor-actions"><button type="button" class="back-btn" onclick="toggleZoneEditor(false)">Cancel</button><button type="submit" class="save-btn">Save zones</button></div>
</form>`;
    }

    function submitZones(e) {
      e.preventDefault();
      const f = e.target, zones = {};
      [1, 2, 3, 4, 5].forEach(z => { const v = f['z' + z].value.trim(); if (v) zones[z] = v; });
      saveZones(byCode[detailCode.toLowerCase()][4], zones);
      toggleZoneEditor(false);
    }

    function toggleZoneEditor(on) {
      editingZones = on;
      renderDetail(byCode[detailCode.toLowerCase()]);
    }

    // Highlight a step and its timeline blocks
    let selected = null;
    function selectKey(key, rep) {
      const id = key === null ? null : key + '|' + rep;
      const already = id !== null && id === selected;
      selected = already ? null : id;
      detailEl.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
      const tl = detailEl.querySelector('.timeline.big');
      const cap = detailEl.querySelector('.tl-caption');
      if (already || key === null) { tl.classList.remove('has-sel'); cap.textContent = 'Tap a block or step to see where it falls'; return; }
      tl.classList.add('has-sel');
      detailEl.querySelectorAll(`[data-key="${key}"]`).forEach(el => {
        if (el.classList.contains('timeline-seg') && rep !== undefined && el.dataset.rep !== String(rep)) return;
        el.classList.add('sel');
      });
      const row = detailEl.querySelector(`.step[data-key="${key}"]`);
      const [i, j] = key.split('.');
      const w = byCode[detailCode.toLowerCase()];
      const steps = parseSteps(w[2], w[4]);
      const st = j === undefined ? steps[i] : steps[i].steps[j];
      cap.textContent = `Step ${+i + 1}${j !== undefined ? String.fromCharCode(97 + +j) : ''}` +
        (j !== undefined ? (rep !== undefined ? ` · rep ${rep} of ${steps[i].reps}` : ` · all ${steps[i].reps} reps`) : '') +
        ` · ${fmtAmount(st.amount, st.unit)} ${zoneLabel(st.zone)}`;
      if (row && rep !== undefined) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    detailEl.addEventListener('click', e => {
      const seg = e.target.closest('.timeline-seg[data-key]');
      if (seg) { selectKey(seg.dataset.key, seg.dataset.rep !== undefined ? +seg.dataset.rep : undefined); return; }
      const row = e.target.closest('.step[data-key]');
      if (row) selectKey(row.dataset.key);
    });

    // Workout view
    function renderDetail(w) {
      detailCode = w[0];
      selected = null;
      const steps = parseSteps(w[2], w[4]);
      const segs = flattenSteps(steps);
      const zones = getZones(w[4]);
      const hasZones = Object.keys(zones).length > 0;
      detailEl.innerHTML = `<div class="detail-bar">
<button class="back-btn" onclick="closeWorkout()">&#8592; Back</button>
<button class="share-btn" onclick="shareWorkout('${w[0]}',this,event)">&#128279; Share</button>
</div>
<div class="detail-card">
<div class="card-top">
<span class="code">${w[0]}</span>
${sportBadge(w[4])}
<span class="category">${w[3]}</span>
</div>
<div class="detail-duration">${formatDuration(w[1], w[4])}</div>
${segs.length ? `${renderBigTimeline(segs)}<div class="tl-caption">Tap a block or step to see where it falls</div>` : ''}
</div>
${segs.length ? `<div class="detail-section"><div class="section-head"><span class="section-title">Steps</span></div>${renderSteps(steps, zones)}</div>
<div class="detail-section"><div class="section-head"><span class="section-title">Zone breakdown</span>
<button class="link-btn" onclick="toggleZoneEditor(${!editingZones})">${hasZones ? 'Edit my zones' : 'Add my zones'}</button></div>
${editingZones ? renderZoneEditor(w[4]) : ''}
${renderZoneSummary(segs, zones)}</div>` : ''}
<div class="detail-section"><div class="section-title">Original description</div><div class="description">${colorZones(w[2])}</div></div>`;
    }

    function showView() {
      const code = new URLSearchParams(window.location.search).get('w');
      const w = code && byCode[code.toLowerCase()];
      if (w) {
        addRecent(w[0]);
        editingZones = false;
        renderDetail(w);
        document.body.classList.add('viewing');
        document.title = w[0] + ' · 80/20 Workout Library';
        window.scrollTo(0, 0);
      } else {
        document.body.classList.remove('viewing');
        document.title = '80/20 Workout Library';
        update();
      }
    }

    function openWorkout(code) {
      history.pushState({ fromList: true }, '', '?w=' + encodeURIComponent(code));
      showView();
    }

    function closeWorkout() {
      // Opened from the list: go back so the search and scroll position are restored.
      // Opened from a shared link: there's no list behind it, so show the home screen.
      if (history.state && history.state.fromList) { history.back(); return; }
      history.replaceState(null, '', window.location.pathname);
      showView();
    }

    window.addEventListener('popstate', () => { loadFromURL(); showView(); });

    // Sport tab switching
    document.getElementById('sportTabs').addEventListener('click', e => {
      const btn = e.target.closest('.sport-tab');
      if (!btn) return;
      document.querySelectorAll('.sport-tab').forEach(b => { b.classList.remove('active', 'active-run', 'active-bike', 'active-swim') });
      activeSport = btn.dataset.sport;
      if (activeSport === 'All') btn.classList.add('active');
      else btn.classList.add('active', 'active-' + activeSport.toLowerCase());
      update();
    });

    // Build category groups
    function getCategoriesForSport(sport) {
      const cats = [];
      const seen = new Set();
      const list = sport === 'All' ? W : W.filter(w => w[4] === sport);
      list.forEach(w => {
        if (!seen.has(w[3])) { seen.add(w[3]); cats.push(w[3]) }
      });
      return cats;
    }

    function renderCategoryBrowser(filtered) {
      const sport = activeSport;
      const cats = getCategoriesForSport(sport);
      if (cats.length === 0) { catBrowserEl.innerHTML = ''; return; }
      // Group filtered workouts by category
      const groups = {};
      filtered.forEach(w => {
        if (!groups[w[3]]) groups[w[3]] = [];
        groups[w[3]].push(w);
      });
      catBrowserEl.innerHTML = cats.filter(c => groups[c]).map(cat => {
        const workouts = groups[cat] || [];
        const badge = workouts[0] ? sportBadge(workouts[0][4]) : '';
        return `<div class="cat-group">
<div class="cat-header" onclick="toggleCat(this)">
<div class="cat-header-left">${badge}<span class="cat-name">${cat}</span><span class="cat-count">${workouts.length} workout${workouts.length !== 1 ? 's' : ''}</span></div>
<span class="cat-arrow">&#9654;</span>
</div>
<div class="cat-body">${workouts.map(renderCard).join('')}</div>
</div>`;
      }).join('');
    }

    function toggleCat(el) {
      el.classList.toggle('open');
      el.nextElementSibling.classList.toggle('open');
    }

    function update() {
      const q = searchEl.value.trim().toLowerCase();
      let filtered = W;
      // Apply sport filter
      if (activeSport !== 'All') {
        filtered = filtered.filter(w => w[4] === activeSport);
      }
      // Apply search query
      if (q) {
        filtered = filtered.filter(w =>
          w[0].toLowerCase().includes(q) ||
          w[2].toLowerCase().includes(q) ||
          w[3].toLowerCase().includes(q) ||
          w[4].toLowerCase().includes(q)
        );
      }
      const total = activeSport === 'All' ? W.length : W.filter(w => w[4] === activeSport).length;
      statsEl.textContent = `Showing ${filtered.length} of ${total} workouts`;
      if (q) {
        // Search mode: show flat results
        catBrowserEl.innerHTML = '';
        recentEl.innerHTML = '';
        if (filtered.length === 0) {
          resultsEl.innerHTML = '<div class="empty"><div class="big">No matches</div><div>Try a different search term</div></div>';
        } else {
          resultsEl.innerHTML = filtered.map(renderCard).join('');
        }
      } else {
        // Browse mode: show category groups
        resultsEl.innerHTML = '';
        renderRecent();
        renderCategoryBrowser(filtered);
      }
    }

    // URL sync: read params on load
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q') || '';
      const sport = params.get('sport') || 'All';
      searchEl.value = q;
      if (['All', 'Run', 'Bike', 'Swim'].includes(sport)) {
        activeSport = sport;
        document.querySelectorAll('.sport-tab').forEach(b => {
          b.classList.remove('active', 'active-run', 'active-bike', 'active-swim');
          if (b.dataset.sport === sport) {
            if (sport === 'All') b.classList.add('active');
            else b.classList.add('active', 'active-' + sport.toLowerCase());
          }
        });
      }
    }

    // URL sync: update params on change
    function syncURL() {
      const params = new URLSearchParams();
      const q = searchEl.value.trim();
      if (q) params.set('q', q);
      if (activeSport !== 'All') params.set('sport', activeSport);
      const newURL = params.toString() ? '?' + params.toString() : window.location.pathname;
      history.replaceState(null, '', newURL);
    }

    // Register service worker for offline/PWA
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => { }); }

    searchEl.addEventListener('input', () => { update(); syncURL(); });

    // Enter/Go opens the exact code match, or the only result
    searchEl.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = searchEl.value.trim().toLowerCase();
      if (!q) return;
      let w = byCode[q];
      if (!w) {
        const matches = W.filter(x => (activeSport === 'All' || x[4] === activeSport) && x[0].toLowerCase().startsWith(q));
        if (matches.length === 1) w = matches[0];
      }
      if (w) { searchEl.blur(); openWorkout(w[0]); }
    });

    // Also sync URL on sport tab click
    const origTabHandler = document.getElementById('sportTabs');
    origTabHandler.addEventListener('click', () => setTimeout(syncURL, 0));

    loadFromURL();
    showView();
  </script>
</body>

</html>
